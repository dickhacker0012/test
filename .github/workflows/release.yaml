name: Release

on:
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Create Draft Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create v2 --draft --generate-notes --verify-tag
